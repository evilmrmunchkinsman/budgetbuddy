<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetBuddy Dashboard</title>
    <!-- Load Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: auto; }
        h1 { text-align: center; color: #2c3e50; }
        .cards { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; text-align: center; }
        .card h3 { margin: 0; color: #7f8c8d; font-size: 14px; text-transform: uppercase; }
        .card p { margin: 10px 0 0; font-size: 28px; font-weight: bold; color: #2c3e50; }
        .chart-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; width: 50%; margin-left: auto; margin-right: auto;}
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #2c3e50; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .flagged { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>BudgetBuddy Dashboard</h1>

    <!-- Summary Cards -->
    <div class="cards">
        <div class="card">
            <h3>Total Spent</h3>
            <p id="totalSpent">Rs. 0</p>
        </div>
        <div class="card">
            <h3>Flagged Alerts</h3>
            <p id="flaggedCount">0</p>
        </div>
    </div>

    <!-- Chart -->
    <div class="chart-container">
        <canvas id="spendChart"></canvas>
    </div>

    <!-- Transactions Table -->
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Merchant</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="transactionTable">
            <!-- Data will be inserted here by JavaScript -->
        </tbody>
    </table>
</div>

<script>
    // Fetch data from our mock API
    async function loadDashboard() {
        try {
            // 1. Fetch Summary Data
            const summaryRes = await fetch('/summary');
            const summary = await summaryRes.json();

            document.getElementById('totalSpent').innerText = `Rs. ${summary.totalSpent.toLocaleString()}`;

            // 2. Render Chart
            const ctx = document.getElementById('spendChart').getContext('2d');
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: Object.keys(summary.spendByCategory),
                    datasets: [{
                        data: Object.values(summary.spendByCategory),
                        backgroundColor: ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71'],
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: { display: true, text: 'Spending by Category', font: { size: 16 } }
                    }
                }
            });

            // 3. Fetch Transactions
            const transRes = await fetch('/transactions');
            const transactions = await transRes.json();

            let flaggedCount = 0;
            const tableBody = document.getElementById('transactionTable');
            
            transactions.forEach(t => {
                if (t.flagged) flaggedCount++;
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${t.date}</td>
                    <td>${t.merchant}</td>
                    <td>${t.category}</td>
                    <td>Rs. ${t.amount.toLocaleString()}</td>
                    <td class="${t.flagged ? 'flagged' : ''}">${t.flagged ? '⚠️ Flagged' : 'Normal'}</td>
                `;
                tableBody.appendChild(row);
            });

            document.getElementById('flaggedCount').innerText = flaggedCount;

        } catch (error) {
            console.error("Error loading dashboard:", error);
        }
    }

    // Run when the page loads
    loadDashboard();
</script>

</body>
</html>
