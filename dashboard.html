<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetBuddy Dashboard</title>
    <!-- Load Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: auto; }
        h1 { text-align: center; color: #2c3e50; }
        .cards { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; text-align: center; }
        .card h3 { margin: 0; color: #7f8c8d; font-size: 14px; text-transform: uppercase; }
        .card p { margin: 10px 0 0; font-size: 28px; font-weight: bold; color: #2c3e50; }
        .chart-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; width: 50%; margin-left: auto; margin-right: auto;}
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #2c3e50; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .flagged { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>BudgetBuddy Dashboard</h1>

    <!-- Summary Cards -->
    <div class="cards">
        <div class="card">
            <h3>Total Spent</h3>
            <p id="totalSpent">Rs. 0</p>
        </div>
        <div class="card">
            <h3>Flagged Alerts</h3>
            <p id="flaggedCount">0</p>
        </div>
    </div>

    <!-- Chart -->
    <div class="chart-container">
        <canvas id="spendChart"></canvas>
    </div>

    <!-- Transactions Table -->
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Merchant</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="transactionTable">
            <!-- Data will be inserted here by JavaScript -->
        </tbody>
    </table>
</div>

<script>
    async function loadDashboard() {
        try {
            const res = await fetch('/transactions');
            const transactions = await res.json();

            let totalSpent = 0;
            let flaggedCount = 0;
            const categoryTotals = {};

            const tableBody = document.getElementById('transactionTable');
            tableBody.innerHTML = ''; 

            if (transactions.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No transactions found. Run testRunner.js!</td></tr>`;
            }

            transactions.forEach(t => {
                // FIX 1: Check for both 'transactionDate' and 'transaction_date'
                const dateStr = t.transactionDate || t.transaction_date || t.date || 'N/A';
                
                // FIX 2: Calculate flags manually since DB doesn't save the boolean
                const isDuplicate = transactions.filter(other => other.merchant === t.merchant && other.amount === t.amount).length > 1;
                const isLarge = t.amount > 10000;
                const isFlagged = t.flagged || isDuplicate || isLarge;

                if (isFlagged) flaggedCount++;
                categoryTotals[t.category] = (categoryTotals[t.category] || 0) + t.amount;
                totalSpent += t.amount;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${dateStr}</td>
                    <td>${t.merchant}</td>
                    <td>${t.category}</td>
                    <td>Rs. ${t.amount.toLocaleString()}</td>
                    <td class="${isFlagged ? 'flagged' : ''}">${isFlagged ? '⚠️ Flagged' : 'Normal'}</td>
                `;
                tableBody.appendChild(row);
            });

            document.getElementById('totalSpent').innerText = `Rs. ${totalSpent.toLocaleString()}`;
            document.getElementById('flaggedCount').innerText = flaggedCount;

            const ctx = document.getElementById('spendChart').getContext('2d');
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: Object.keys(categoryTotals),
                    datasets: [{
                        data: Object.values(categoryTotals),
                        backgroundColor: ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6'],
                    }]
                },
                options: { responsive: true, plugins: { title: { display: true, text: 'Spending by Category', font: { size: 16 } } } }
            });
        } catch (error) {
            console.error("Error loading dashboard:", error);
        }
    }
    loadDashboard();
</script>
</body>
</html>
